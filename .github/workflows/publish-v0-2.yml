name: Publish KPB value proposition demo v0.2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v0-2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply the reviewed v0.2 patch
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'id="client-pain"' index.html; then
            echo "v0.2 content is already present."
          else
            git apply --check patches/value-v0-2.patch
            git apply patches/value-v0-2.patch
          fi

      - name: Validate release files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s value-v0-2.css
          grep -q 'href="value-v0-2.css"' index.html
          grep -q 'id="client-pain"' index.html
          grep -q 'id="advantage"' index.html
          grep -q 'id="cases"' index.html
          grep -q 'Interactive stakeholder concept · v0.2' index.html

      - name: Commit and publish to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No release changes to commit."
            exit 0
          fi
          git commit -m "Publish KPB value proposition demo v0.2"
          git push origin HEAD:main
