name: Verify KPB demo v0.2 on GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-pages-v0-2.yml

permissions:
  contents: write

jobs:
  verify-live-page:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait for and verify GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          LIVE_URL="https://montri-th.github.io/KPB-private-match/"
          CSS_URL="https://montri-th.github.io/KPB-private-match/value-v0-2.css"
          verified=false

          for attempt in $(seq 1 24); do
            echo "Verification attempt ${attempt}/24"
            if curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "${LIVE_URL}?verify=${GITHUB_SHA}-${attempt}" -o /tmp/kpb-live.html \
              && grep -q 'id="client-pain"' /tmp/kpb-live.html \
              && grep -q 'id="advantage"' /tmp/kpb-live.html \
              && grep -q 'id="cases"' /tmp/kpb-live.html \
              && grep -q 'Interactive stakeholder concept · v0.2' /tmp/kpb-live.html \
              && curl -fsSL --max-time 30 -H 'Cache-Control: no-cache' "${CSS_URL}?verify=${GITHUB_SHA}-${attempt}" -o /tmp/value-v0-2.css \
              && grep -q 'stakeholder value extension v0.2' /tmp/value-v0-2.css; then
              verified=true
              break
            fi
            sleep 10
          done

          if [ "$verified" != true ]; then
            echo "GitHub Pages did not expose the v0.2 release within the verification window." >&2
            exit 1
          fi

          cat > DEPLOYMENT_VERIFIED.md <<EOF
          # Deployment verified

          - Site: ${LIVE_URL}
          - Release: KPB Private Property Opportunities v0.2
          - Verified by: GitHub Actions
          - Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          - Source commit containing the release: cf99fa369012c43a5e48ebbc0320fe96c02a0962
          - Checks: HTML loaded; client pain section present; KPB × Landometer advantages present; tangible cases present; v0.2 stylesheet loaded.
          EOF

      - name: Commit verification receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_VERIFIED.md
          git commit -m "Verify KPB demo v0.2 live on GitHub Pages"
          git push origin HEAD:main
